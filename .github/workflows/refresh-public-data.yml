name: Refresh public roster data

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      data_as_of:
        description: 'UTC snapshot date (YYYY-MM-DD); blank uses today'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Repull common public snapshot
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh the season-timeline snapshot and rebuild the storylines
        env:
          DATA_AS_OF: ${{ github.event_name == 'workflow_dispatch' && inputs.data_as_of || '' }}
        run: |
          if [ -z "$DATA_AS_OF" ]; then unset DATA_AS_OF; fi
          bun spikes/mlb-2026/timeline-fetch.mjs
          bun spikes/mlb-2026/timeline-build.mjs
          bunx prettier --write spikes/mlb-2026/timeline-snapshot.json src/lib/storylines/*.json

      - name: Sync registry digests and expectations
        run: bun spikes/mlb-2026/sync-registry.mjs

      - name: Validate refreshed bundles
        run: bun run check && bun run lint && bunx vitest run --project server --project integration

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-public-data-refresh
          delete-branch: true
          title: 'data: refresh public roster snapshot'
          commit-message: 'data: refresh public roster snapshot'
          body: |
            Automated refresh of the 2026 season-timeline snapshot (D-44).

            This PR is intentionally reviewable and does not deploy by itself.
            Dated storylines keep their decision-date windows; only the
            season-to-date storyline and the record line should move. Review
            changed rates, eligibility, input digests, and storyline
            expectations before merging.

            Historical retrospective event metadata is not changed by this job.
          labels: data-refresh
