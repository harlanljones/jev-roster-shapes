name: Refresh public roster data

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      data_as_of:
        description: 'UTC snapshot date (YYYY-MM-DD); blank uses today'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Repull common public snapshot
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh configured 2026 decision pool
        env:
          DATA_AS_OF: ${{ github.event_name == 'workflow_dispatch' && inputs.data_as_of || '' }}
          DATA_REFRESH: '1'
        run: |
          AS_OF="${DATA_AS_OF:-$(date -u +%F)}"
          DATA_AS_OF="$AS_OF" DATA_FETCHED_AT="${AS_OF}T00:00:00Z" DATA_REFRESH=1 bun spikes/mlb-2026/build.mjs

      - name: Sync registry digests and expectations
        run: bun spikes/mlb-2026/sync-registry.mjs

      - name: Validate refreshed bundles
        run: bun run check && bun run lint && bunx vitest run --project server --project integration

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-public-data-refresh
          delete-branch: true
          title: 'data: refresh public roster snapshot'
          commit-message: 'data: refresh public roster snapshot'
          body: |
            Automated refresh of the common public 2026 decision-pool snapshot.

            This PR is intentionally reviewable and does not deploy by itself.
            Review changed roster membership, eligibility, rates, input digests,
            and hand-derived storyline expectations before merging.

            Historical retrospective event metadata is not changed by this job.
          labels: data-refresh
